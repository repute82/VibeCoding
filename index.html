<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 첫 주소로 들어오면 0초 뒤 hello.html로 바로 이동합니다 -->
  <meta http-equiv="refresh" content="0; url=hello.html">
  <title>VibeCoding</title>
</head>
<body>
  <!-- 자동 이동이 막힌 브라우저를 위해 직접 누를 수 있는 링크를 둡니다 -->
  <p><a href="hello.html">hello.html로 이동하기</a></p>
</body>
</html>
